<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFE27A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Color Critters</title>
</head>
<body>
  <main id="picker" class="screen">
    <div id="grid" class="grid"></div>
    <button id="mute" class="mute" type="button" aria-label="Sound on" aria-pressed="false"></button>
  </main>

  <main id="coloring" class="screen" hidden>
    <div class="side">
      <button id="home" class="big-btn" type="button" aria-label="Home"></button>
      <button id="clear" class="big-btn clear" type="button" aria-label="Clear (press and hold)"></button>
    </div>
    <div id="stage" class="stage">
      <canvas id="paint" width="1024" height="1024"></canvas>
      <img id="outline" class="outline" alt="" draggable="false" />
    </div>
    <div id="palette" class="palette"></div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
